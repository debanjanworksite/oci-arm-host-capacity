name: Create OCI Instance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  create-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Setup and Create Instance
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
          
        run: |
          pip install oci-cli -q
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/private_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "$OCI_USER_ID" "$OCI_KEY_FINGERPRINT" "$OCI_TENANCY_ID" "$OCI_REGION" \
            "/home/runner/.oci/private_key.pem" > ~/.oci/config
          chmod 600 ~/.oci/config
          
          cat > /tmp/instance.json << ENDJSON
          {
            "availabilityDomain": "AP-HYDERABAD-1-AD-1",
            "compartmentId": "$OCI_TENANCY_ID",
            "shape": "VM.Standard.A1.Flex",
            "shapeConfig": {"ocpus": 4, "memoryInGBs": 24},
            "sourceDetails": {"sourceType": "image", "imageId": "$OCI_IMAGE_ID"},
            "createVnicDetails": {"subnetId": "$OCI_SUBNET_ID", "assignPublicIp": true},
            "metadata": {"ssh_authorized_keys": "$OCI_SSH_PUBLIC_KEY"},
            "displayName": "gyanaloy-server"
          }
            ENDJSON
          
          cat /tmp/instance.json
          
          oci compute instance launch \
            --from-json file:///tmp/instance.json \
            --subnet-id "$OCI_SUBNET_ID" \
            2>&1 || echo "Out of capacity, will retry"
            
          
          oci compute instance launch \
            --from-json file:///tmp/instance.json \
            --subnet-id "$OCI_SUBNET_ID" \
            2>&1 || echo "Out of capacity, will retry"
